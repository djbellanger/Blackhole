<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Black Hole Vacuum</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .stat-card {
            background: rgba(15, 15, 25, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0c0;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .tier-badge {
            background: linear-gradient(135deg, #7928ca, #ff0080);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.4);
        }
        .hud-bottom {
            display: flex;
            gap: 12px;
            justify-content: center;
            pointer-events: auto;
            margin-bottom: 8px;
        }
        .btn {
            background: rgba(25, 25, 40, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 105px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-sub {
            font-size: 10px;
            color: #ffd700;
            margin-top: 2px;
        }
        .btn-ad {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            box-shadow: 0 0 15px rgba(255, 65, 108, 0.4);
        }
        /* Modal Style */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #12121a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .modal-desc {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .ad-timer {
            font-size: 32px;
            font-weight: 800;
            color: #ff0080;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="stat-card">
                <div class="stat-label">Mass Consumed</div>
                <div class="stat-value" id="mass-val">0</div>
            </div>
            <div class="tier-badge" id="tier-val">Dust Motes</div>
        </div>

        <div class="hud-bottom">
            <button class="btn" id="btn-size">
                <span>Expand Hole</span>
                <span class="btn-sub" id="cost-size">10 M</span>
            </button>
            <button class="btn" id="btn-pull">
                <span>Gravity Pull</span>
                <span class="btn-sub" id="cost-pull">15 M</span>
            </button>
            <button class="btn btn-ad" id="btn-ad">
                <span>Supernova</span>
                <span class="btn-sub"> Watch Ad </span>
            </button>
        </div>
    </div>

    <!-- Simulated Ad Modal -->
    <div class="modal-overlay" id="ad-modal">
        <div class="modal-card">
            <div class="modal-title">Simulated Rewarded Ad</div>
            <div class="modal-desc">Triggering Supernova Burst...</div>
            <div class="ad-timer" id="ad-timer">3</div>
            <p style="font-size: 11px; color: #666;">In production, your Ad SDK displays here.</p>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playAbsorbSound(pitchModifier = 1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            const startFreq = 120 * pitchModifier;
            const endFreq = 40 * pitchModifier;
            
            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 10), audioCtx.currentTime + 0.15);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSupernovaSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.5);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        // Tiers Progression Data
        const TIERS = [
            { threshold: 0, name: "Dust Motes", color: "#a0a0c0", particleSize: 2 },
            { threshold: 100, name: "Paper Scraps", color: "#e0e0e0", particleSize: 3.5 },
            { threshold: 500, name: "Office Supplies", color: "#ff9900", particleSize: 5 },
            { threshold: 2500, name: "Furniture", color: "#8b5a2b", particleSize: 7 },
            { threshold: 10000, name: "Vehicles", color: "#00ccff", particleSize: 10 },
            { threshold: 50000, name: "Skyscrapers", color: "#ff0055", particleSize: 15 },
            { threshold: 250000, name: "Planets & Stars", color: "#9900ff", particleSize: 22 },
            { threshold: 1000000, name: "Pure Light", color: "#ffffff", particleSize: 30 }
        ];

        // Game State
        let state = {
            mass: 0,
            sizeLevel: 1,
            pullLevel: 1,
            holeRadius: 25,
            pullForce: 0.15
        };

        // Load Save Data
        const saved = localStorage.getItem('bh_vacuum_save');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
            } catch(e) {}
        }

        function saveGame() {
            localStorage.setItem('bh_vacuum_save', JSON.stringify(state));
        }

        // Canvas Setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Hole Position (Follows Touch/Cursor)
        const hole = {
            x: width / 2,
            y: height / 2,
            targetX: width / 2,
            targetY: height / 2,
            pulse: 0
        };

        // Particle System
        const particles = [];
        const MAX_PARTICLES = 120;

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                // Spawn randomly outside edges or across screen
                if (Math.random() < 0.5) {
                    this.x = Math.random() < 0.5 ? -20 : width + 20;
                    this.y = Math.random() * height;
                } else {
                    this.x = Math.random() * width;
                    this.y = Math.random() < 0.5 ? -20 : height + 20;
                }
                
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                
                // Determine current tier characteristics
                const currentTierIndex = getCurrentTierIndex();
                const tier = TIERS[currentTierIndex];
                
                this.size = tier.particleSize * (0.8 + Math.random() * 0.4);
                this.color = tier.color;
                this.value = Math.pow(2, currentTierIndex);
            }

            update() {
                const dx = hole.x - this.x;
                const dy = hole.y - this.y;
                const distSq = dx * dx + dy * dy;
                const dist = Math.sqrt(distSq);

                // Gravitational acceleration
                const force = (state.pullForce * 1000) / Math.max(distSq, 400);
                this.vx += (dx / dist) * force;
                this.vy += (dy / dist) * force;

                // Dampen velocity slightly
                this.vx *= 0.98;
                this.vy *= 0.98;

                this.x += this.vx;
                this.y += this.vy;

                // Absorption check
                const absorbDist = state.holeRadius * 0.6;
                if (dist < absorbDist) {
                    state.mass += this.value;
                    playAbsorbSound(1 + (this.value * 0.05));
                    this.reset();
                    updateUI();
                    saveGame();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Particles
        for (let i = 0; i < MAX_PARTICLES; i++) {
            particles.push(new Particle());
        }

        function getCurrentTierIndex() {
            let index = 0;
            for (let i = 0; i < TIERS.length; i++) {
                if (state.mass >= TIERS[i].threshold) index = i;
            }
            return index;
        }

        // Pointer Controls
        function handlePointer(e) {
            initAudio();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            hole.targetX = clientX;
            hole.targetY = clientY;
        }

        window.addEventListener('pointerdown', handlePointer);
        window.addEventListener('pointermove', (e) => {
            if (e.buttons > 0 || e.touches) handlePointer(e);
        });

        // UI Upgrades Logic
        const massVal = document.getElementById('mass-val');
        const tierVal = document.getElementById('tier-val');
        const costSize = document.getElementById('cost-size');
        const costPull = document.getElementById('cost-pull');

        function getSizeCost() { return Math.floor(10 * Math.pow(1.6, state.sizeLevel - 1)); }
        function getPullCost() { return Math.floor(15 * Math.pow(1.6, state.pullLevel - 1)); }

        function updateUI() {
            massVal.innerText = state.mass.toLocaleString();
            
            const tierIndex = getCurrentTierIndex();
            tierVal.innerText = TIERS[tierIndex].name;

            costSize.innerText = `${getSizeCost()} M`;
            costPull.innerText = `${getPullCost()} M`;

            state.holeRadius = 25 + (state.sizeLevel - 1) * 4;
            state.pullForce = 0.15 + (state.pullLevel - 1) * 0.08;
        }

        document.getElementById('btn-size').addEventListener('click', () => {
            const cost = getSizeCost();
            if (state.mass >= cost) {
                state.mass -= cost;
                state.sizeLevel++;
                updateUI();
                saveGame();
            }
        });

        document.getElementById('btn-pull').addEventListener('click', () => {
            const cost = getPullCost();
            if (state.mass >= cost) {
                state.mass -= cost;
                state.pullLevel++;
                updateUI();
                saveGame();
            }
        });

        // Rewarded Ad Simulation
        /* AD HOOK: replace the body of showRewardedAd with your ad SDK's rewarded-ad call.
           Call onReward() only after the SDK reports the ad was watched to the end. */
        const adModal = document.getElementById('ad-modal');
        const adTimer = document.getElementById('ad-timer');

        function showRewardedAd(onReward) {
            adModal.classList.add('active');
            let count = 3;
            adTimer.innerText = count;

            const interval = setInterval(() => {
                count--;
                adTimer.innerText = count;
                if (count <= 0) {
                    clearInterval(interval);
                    adModal.classList.remove('active');
                    onReward();
                }
            }, 1000);
        }

        document.getElementById('btn-ad').addEventListener('click', () => {
            showRewardedAd(() => {
                // Trigger Supernova Effect
                playSupernovaSound();
                particles.forEach(p => {
                    state.mass += p.value * 2;
                    p.reset();
                });
                updateUI();
                saveGame();
            });
        });

        // Main Loop
        function render() {
            // Smooth Hole Movement
            hole.x += (hole.targetX - hole.x) * 0.15;
            hole.y += (hole.targetY - hole.y) * 0.15;
            hole.pulse += 0.05;

            // Clear Background
            ctx.fillStyle = 'rgba(5, 5, 8, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Update & Draw Particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Draw Black Hole Accretion Disk
            const pulseRadius = state.holeRadius + Math.sin(hole.pulse) * 2;
            
            const gradient = ctx.createRadialGradient(
                hole.x, hole.y, pulseRadius * 0.2,
                hole.x, hole.y, pulseRadius * 1.8
            );
            gradient.addColorStop(0, '#000000');
            gradient.addColorStop(0.5, '#00f0ff');
            gradient.addColorStop(0.8, 'rgba(255, 0, 128, 0.5)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(hole.x, hole.y, pulseRadius * 1.8, 0, Math.PI * 2);
            ctx.fill();

            // Black Hole Center
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(hole.x, hole.y, pulseRadius * 0.7, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(render);
        }

        updateUI();
        render();
    </script>
</body>
</html>
